name: memos_one
description: Offline-first native client for Memos. One Client. Every Device. Your Memos.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (Offline First source of truth)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Network (Memos API)
  dio: ^5.7.0

  # Secure / lightweight local config
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Markdown
  flutter_markdown: ^0.7.4+3

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.0
  equatable: ^2.0.7
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.1
  logger: ^2.5.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  # fonts:
  #   - family: AppFont
  #     fonts:
  #       - asset: assets/fonts/AppFont-Regular.ttf
